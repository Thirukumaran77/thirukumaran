<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            color: rgb(70, 0, 107);
        }
        div{
            background-color: darkseagreen;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .squre{
            background-color: rgb(205, 9, 114);
            height: 60vh;
            width: 60vh;
            border: 2px solid transparent;
            border-radius: 50%;
            text-align: center;
            
        }
        #cc{
            background-color: rgb(179, 3, 17);

        }

        input{
            color: inherit;
            background-color: inherit;
            border-top: none;
            border-left: none;
            border-right: none;
            border-color: rgb(211, 19, 57);
        }
        .tt{
            padding-right: 40px;
        }

        .bg{
            background-image: url(ak.jpg);
            background-repeat: no-repeat;
            background-size: cov er;
            background-attachment: fixed;
            opacity: 0.8;


        }


        

    </style>
</head>
<body>
    <div>
    <div class="squre" id="cc"><h1 class="tt">THIRUKUMARAN</h1></div>
       
    </div>



    <div style="display: block;padding-left: 40px;height: 150vh;">
        <form style="display: inherit;">
            <fieldset style="padding: 50px;">
                <legend><b>STUDENT DETAILS</b></legend>
                <label for="name">User Name :</label>
                <input type="text" id="Name">  
                <br><br>
                <label for="father name"> Father name :</label>
                <input type="text" id="father name">
                <br><br>
                <label for="email">Email :</label>
                <input type="email" id="phone" placeholder="thiru77@gmail.com">
                <br><br>
                <label for="phone">Phone :</label>
                <input type="tel" id="phone" placeholder="=91 00000 00000">
                <br><br>
                <label for="age">Age :</label>
                <input type="number" id="age">
                <br><br>
                <label for="dob">Dob :</label>
                <input required type="date" id="dob">
                <br><br>
                <label for="photo">Photo :</label>
                <input required type="file" id="photo">
                <br><br>
                <label for="password">Password  :</label>
                <input type="password" id="password" required>
                <br><br>

                <!-- Radio box -->
                <label for="dom">Domain :</label>
                <br>
                <input type="radio" name="domain" value="Python full stack">
                <label for="c">Python full stack</label>
                <br>
                <input type="radio" name="domain" value="Java full stack">
                <label for="c">Java full stack</label>
                <br>
                <input type="radio" name="domain" value="Mern full stack">
                <label for="c">Mern full stack</label>
                <br>
                <input type="radio" name="domain" value="Full stack with AI">
                <label for="c">Full stack with AI</label>
                <br>
                <br>


                <!-- Check box -->
                 <label for="Education">Education :</label>
                 <br>
                 <input type="checkbox" name="domain" value="10th">
                 <label for="c">10th</label>
                 <br>
                 <input type="checkbox" name="domain" value="12th">
                 <label for="c">12th</label>
                 <br>
                 <input type="checkbox" name="domain" value="UG">
                 <label for="c">UG</label>
                 <br>
                 <input type="checkbox" name="domain" value="PG">
                 <label for="c">PG</label>
                 <br>
                 <br>
                 <label for="country">Country :</label>
                 <select name="Country" id="co">
                    <option value="India">India</option>
                    <option value="UK">UK</option>
                    <option value="China">China</option>
                    <option value="Japan">Japan</option>
                </select>
                <br><br>
                <label for="message">Message :</label>
                <br>
                <textarea name="message" id="message"></textarea>
                <br><br>


                <button type="submit">Submit</button>
                <button>Reset</button>
            


            </fieldset>


        </form>


    </div>
