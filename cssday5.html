<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .ff{
            float: right;
        }
        .bg{
            /* height: 100vh; */
            background-image:url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRBPtMEoHJ0jGRO1y0gV_vFv-bJ6vNOw1EEzVwU0w6zTA&s);
            background-repeat: no-repeat;
            background-size: cover;
        }
        .la{
            height: 100vh;
            background-color: black;
            opacity: 0.8;
        }
        .ts{
            margin: 150px;
            transition: height 2s,width 2s, transform 2s;
        }
        .ts:hover{
            height: 300px;
            width: 300px;
            transform: rotate(45deg);
            transform: rotate(180deg);
            transform: rotateX(90deg);
            transform: rotateY(45deg);
            transform: scale(2);
            transform:skew(45deg) ;
            transform:scaleX(45deg) ;
            transform:skewY(20deg) ;
        }
        ul{
            display: flex;
            justify-content: center;
            gap: 70px;
            padding: 30px 0px;
        }
        li{
            list-style: none;
            font-size: 20px;
            transition:font-size 0.5s, font-weight 0.5s, color 0.5s, text-decoration-line 0.5s;
        }
        li:hover{
            font-size: 23px;
            font-weight: 900;
            color: darkred;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>Service</li>
            <li>Product</li>
            <li>About</li>
        </ul>
    </nav>
    
    <div class="bg">
        <img class="ff" src="https://www.notebookcheck.net/fileadmin/Notebooks/News/_nc5/Avengers-Doomsday-fan-art.png" alt="Doomsday" width="150" height="150">
        <div class="la">
            <img class="ts" src="https://www.notebookcheck.net/fileadmin/Notebooks/News/_nc5/Avengers-Doomsday-fan-art.png" alt="" width="150" height="150">

        </div>
    </div>
</body>
</html>
