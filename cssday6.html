<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap');
        .box{
            width: 150px;
            height: 150px;
            background-color:brown;
            animation-name: b;
            animation-duration: 1s;
            animation-iteration-count: infinite;
        }
        @keyframes b{
            from{
                background-color: blue;
            }
            to{
                background-color: gold;
            }
        }
        h1{
            font-family: "Black Ops One", system-ui;
            font-weight: 500;
            font-style: normal;
            color: lime;
            animation-name: name;
            animation-duration: 2s;
            animation-iteration-count: 5;
            position: relative;
            left: 200px;
        }
        @keyframes name {
            0%{
                color: darkblue;
                left: 0px;
            }
            25%{
                color: chocolate;
            }
            50%{
                color: aqua;
            }
            75%{
                color: brown;
            }
            100%{
                color: blueviolet;
                left: 300px;
            }
        }
        .cr{
            width: 200px;
            height: 200px;
            background-color:chartreuse ;
            border-radius: 50%;
            animation-name: move;
            animation-duration: 4s;
            animation-iteration-count: infinite;
            position: relative;
            left: 800px;
            top: 100px;
            transition: transform 2s;
        }
        @keyframes move {
            0%{
                top: 0px;
                left: 0px;
                transform: scale(1);
            }
            25%{
                top: 0px;
                left: 400px;
                transform: scale(1);
            }
            50%{
                left: 400px;
                top: 100px;
                transform: scale(1);
            }
            75%{
                left: 800px;
                top: 100px;
                transform: scale(1.5);
            }
            100%{
                 transform: scale(2);
            }
        }
    </style>
</head>
<body>
    <div class="box">

    </div>
    <h1>Thirukumaran</h1>

    <div class="cr"></div>
</body>
</html>
